<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CFO Agent — Arbitrum Treasury Guardian</title>
    <meta name="description" content="Autonomous on-chain CFO agent for Arbitrum. Execute payment rules 24/7 with zero manual transactions."/>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              sans: ['Inter', 'ui-sans-serif', 'system-ui'],
              display: ['Space Grotesk', 'sans-serif'],
              mono: ['JetBrains Mono', 'ui-monospace'],
            }
          }
        }
      }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Space+Grotesk:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet"/>
    <style>
      ::-webkit-scrollbar { width: 6px; }
      ::-webkit-scrollbar-track { background: #0b0e14; }
      ::-webkit-scrollbar-thumb { background: #30363d; border-radius: 9999px; }
      ::-webkit-scrollbar-thumb:hover { background: #28a0f0; }
      @keyframes toastIn { from { transform: translateY(20px) scale(0.95); opacity: 0; } to { transform: none; opacity: 1; } }
      @keyframes timerShrink { from { width: 100%; } to { width: 0%; } }
      .toast-in { animation: toastIn 0.25s cubic-bezier(0.16,1,0.3,1) forwards; }
      .timer-shrink { animation: timerShrink 5000ms linear forwards; }
      .line-grid {
        background-image: linear-gradient(rgba(40,160,240,0.05) 1px, transparent 1px),
                          linear-gradient(90deg, rgba(40,160,240,0.05) 1px, transparent 1px);
        background-size: 20px 20px;
      }
      body { background-color: #0b0e14; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
